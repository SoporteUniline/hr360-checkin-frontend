name: CI/CD — Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: adamia-lightsail-deploy
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. PREPARE — Validar instalación
  # ─────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────
  # 2. VALIDATE — Lint e integración MySQL
  # ─────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Start MySQL for integration tests
        run: |
          set -e

          if ! command -v mysql >/dev/null 2>&1; then
            echo "MySQL no está instalado en el runner"
            exit 1
          fi

          sudo systemctl start mysql

          sudo mysql -e "
            ALTER USER 'root'@'localhost'
            IDENTIFIED WITH caching_sha2_password
            BY 'cau_ci_test_only';
          "

          mysqladmin ping \
            -h 127.0.0.1 \
            -uroot \
            -pcau_ci_test_only

          echo "MySQL disponible para las pruebas"

      - name: Lint (errores = falla | warnings = OK)
        run: npm run lint

      - name: Control de Activos — integración MySQL
        env:
          CAU_TEST_HOST: 127.0.0.1
          CAU_TEST_PORT: "3306"
          CAU_TEST_PASSWORD: cau_ci_test_only
        run: node --test scripts/test-activos-modules.mjs scripts/test-activos-api.mjs

  # ─────────────────────────────────────────────
  # 3. BUILD — Validar compilación
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        env:
          NEXT_PUBLIC_RUTA_BACKEND: ${{ secrets.NEXT_PUBLIC_RUTA_BACKEND }}
          NEXT_PUBLIC_RUTA_DOMAIN: ${{ secrets.NEXT_PUBLIC_RUTA_DOMAIN }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_TINYMCE_KEY: ${{ secrets.NEXT_PUBLIC_TINYMCE_KEY }}
          NEXT_PUBLIC_USERNAME_GEONAMES: ${{ secrets.NEXT_PUBLIC_USERNAME_GEONAMES }}
        run: npm run build

  # ─────────────────────────────────────────────
  # 4. UPLOAD — Despliegue a Lightsail
  # ─────────────────────────────────────────────
  upload:
    name: Upload & Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      deploy_sha: ${{ github.sha }}
    steps:
      - name: Ejecutar deploy-dev.sh en Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Iniciando deploy — SHA: ${{ github.sha }}"
            bash ~/adamia/deploy-dev.sh
            echo "✅ deploy-dev.sh completado"

  # ─────────────────────────────────────────────
  # 5. DEPLOY — Health check
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — Health Check
    runs-on: ubuntu-latest
    needs: upload
    environment: dev
    steps:
      - name: Esperar que la app levante
        run: sleep 15

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.APP_HEALTH_URL }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "❌ Health check falló con status $STATUS"
            exit 1
          fi
          echo "✅ La app responde correctamente (HTTP $STATUS)"

      - name: Registrar SHA desplegado
        run: |
          echo "SHA desplegado: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.event.head_commit.message }}"
