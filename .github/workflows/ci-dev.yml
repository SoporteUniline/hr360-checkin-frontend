name: CI/CD — Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: adamia-lightsail-deploy
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. PREPARE — Validar instalación
  # ─────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────
  # 2. VALIDATE — Lint e integración MySQL
  # ─────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Start MySQL for integration tests
        run: |
          set -e

          sudo systemctl start mysql

          echo "Configurando MySQL..."

          MYSQL_ADMIN_FILE="/etc/mysql/debian.cnf"

          if [ ! -f "$MYSQL_ADMIN_FILE" ]; then
            echo "No existe el archivo de credenciales administrativas"
            exit 1
          fi

          sudo mysql --defaults-file="$MYSQL_ADMIN_FILE" -e "
            ALTER USER 'root'@'localhost'
            IDENTIFIED WITH caching_sha2_password
            BY 'cau_ci_test_only';
          "

          echo "Verificando conexión MySQL..."

          mysqladmin ping \
            -h 127.0.0.1 \
            -uroot \
            -pcau_ci_test_only

          echo "MySQL listo para pruebas"

      - name: Lint (errores = falla | warnings = OK)
        run: npm run lint

      - name: Control de Activos — integración MySQL
        env:
          CAU_TEST_HOST: 127.0.0.1
          CAU_TEST_PORT: "3306"
          CAU_TEST_PASSWORD: cau_ci_test_only
        run: node --test scripts/test-activos-modules.mjs scripts/test-activos-api.mjs

      - name: Asistencias — cálculo de horas y exportación
        run: node --test scripts/test-fecha-input.mjs scripts/test-jornada-asistencia.mjs scripts/test-asistencias-hoy.mjs scripts/test-monitor.mjs scripts/test-situacion-hoy.mjs scripts/test-pausas-dia.mjs scripts/test-pin-rh.mjs scripts/test-pantalla-firma.mjs scripts/test-qr-imagen.mjs scripts/test-credencial.mjs scripts/test-consulta-periodo.mjs scripts/test-cambios-asistencia.mjs scripts/test-calendario-asistencia.mjs scripts/test-horas-extra.mjs scripts/test-horas-extra-dia.mjs scripts/test-reloj-dia.mjs scripts/test-tipos-goce.mjs scripts/test-quepaso-motivo.mjs scripts/test-monitor-equipo.mjs scripts/test-historial-asistencia.mjs scripts/test-semana-horas.mjs scripts/test-turnos-extra.mjs scripts/test-motivo-pendiente.mjs scripts/test-hora12.mjs scripts/test-masivo-asistencia.mjs scripts/test-control-horas-extra.mjs scripts/test-matriz-horas-extra.mjs scripts/test-permiso-horas.mjs scripts/test-horas-por-reponer.mjs scripts/test-fecha-hora.mjs scripts/test-activos.mjs scripts/test-evaluaciones.mjs scripts/test-reloj-recientes.mjs scripts/test-reloj-confirmacion.mjs scripts/test-facial-startup.mjs scripts/test-faceapi-browser.mjs scripts/test-cuerpo-bloqueado.mjs scripts/test-faceapi-preload.mjs scripts/test-local-clock-events.mjs scripts/test-diagnostico-reloj.mjs scripts/test-popups.mjs scripts/test-consentimiento.mjs scripts/test-nomina.mjs scripts/test-rutas-internas.mjs scripts/test-fetch-seguro.mjs scripts/test-pdf-marca.mjs scripts/test-html-seguro.mjs scripts/test-postulacion-token.mjs scripts/test-reporte-comida.mjs scripts/test-limite-legal.mjs scripts/test-whatsapp.mjs scripts/test-whatsapp-agente.mjs scripts/test-whatsapp-agenda.mjs scripts/test-whatsapp-adjuntos.mjs scripts/test-whatsapp-calendario.mjs scripts/test-whatsapp-salud.mjs scripts/test-modulos.mjs scripts/test-reclutamiento-adaptador.mjs scripts/test-proceso-whatsapp.mjs scripts/test-rostro-celular.mjs scripts/test-bolsa-trabajo.mjs scripts/test-cambios-pendientes.mjs scripts/test-rostro-guia.mjs scripts/test-rostro-poses.mjs scripts/test-rostro-reglas.mjs scripts/test-reloj-en-linea.mjs scripts/test-reloj-sonido.mjs scripts/test-encuadre-rostro.mjs scripts/test-pantalla-encendida.mjs scripts/test-retire-offline-worker.mjs scripts/test-mi-cuenta.mjs scripts/test-datos-vivos.mjs scripts/test-guion-landing.mjs scripts/test-clima.mjs scripts/test-clima-resultados.mjs scripts/test-clima-aviso.mjs scripts/test-clima-sugerencias.mjs scripts/test-whatsapp-atencion.mjs scripts/test-permisos.mjs scripts/test-whatsapp-lumo.mjs scripts/test-whatsapp-lumo-b.mjs scripts/test-aprobacion-whatsapp.mjs scripts/test-motivo-correccion.mjs scripts/test-calculos-lft.mjs scripts/test-mosaico.mjs

      - name: Asistencias — horas extra con la jornada diaria (misma regla que el servidor)
        run: node --test scripts/test-extra-del-dia.mjs

      - name: Evaluación del desempeño — tablero, IA, evidencia y PDF (desemp1)
        run: node --test scripts/test-evaluaciones-tablero.mjs scripts/test-evaluaciones-api.mjs

      - name: Asistencias y Monitor — refresco sin recargar (claves, SSE, ediciones abiertas)
        run: node --test scripts/test-refresco-asistencias.mjs

      - name: Clima — canales, recordatorios, vista del jefe y «¿Cómo te fue hoy?»
        run: node --test scripts/test-clima-canales.mjs

      - name: Créditos de Adamia AI — saldo, recargas y panel del administrador
        run: node --test scripts/test-creditos-ia.mjs

      - name: Créditos de Adamia AI — crédito de bienvenida, aviso sin créditos y pago OXXO/SPEI fallido
        run: node --test scripts/test-creditos-bienvenida.mjs

      - name: Créditos de Adamia AI — interruptor del cobro en el panel y «Gratis por ahora» al cliente
        run: node --test scripts/test-cobro-interruptor.mjs

      - name: Passkeys (Face ID / huella) y sesiones revocables — lógica
        run: node --test scripts/test-passkeys.mjs

      - name: Avisos y felicitaciones — campana, WhatsApp y plantillas de correo
        run: node --test scripts/test-avisos.mjs

      - name: Desempeño — objetivos, 1:1, feedback, calibración 9-box y bono (pantallas)
        run: node --test scripts/test-evaluaciones-talento.mjs

      - name: Clima — NOM-035 lista para inspección, buzón, analítica, riesgo de rotación y ciclo de vida
        run: node --test scripts/test-clima-inspeccion.mjs

      - name: Plantillas de WhatsApp — reglas de Meta, vista previa y catálogo (panel del administrador)
        run: node --test scripts/test-plantillas-whatsapp.mjs

      - name: Integraciones — llaves de API por empresa (panel del dueño) y documentación /desarrolladores
        run: node --test scripts/test-integraciones.mjs

      - name: Inducción digital — plantillas, tablero, liga del celular y ruta de bienvenida (reglas de presentación)
        run: node --test scripts/test-induccion.mjs

      - name: Centro de comunicados — reglas de presentación, liga del correo y service worker de push
        run: node --test scripts/test-comunicados.mjs

      # Verificación en navegador con el backend simulado (1440 y 390): panel, aviso emergente (no se cierra con clic al
      # fondo) y muro de Mi espacio. Compila con un backend inexistente para que nada salga a la red.
      - name: Centro de comunicados — verificación en navegador (Playwright)
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://api.prueba.invalid/api
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          npx next build
          mkdir -p capturas-comunicados
          CAPTURAS=capturas-comunicados node scripts/verify-comunicados.mjs

      # (27/11/2026) Centro de ayuda: formato de las guías (frontmatter y Markdown del subconjunto), imágenes y enlaces que
      # existen, pantallas y fuentes que existen, nada interno en lo público y cobertura de pantallas (COBERTURA_ESTRICTA
      # en el script). Avisa —sin fallar— si una fuente cambió después de «actualizado».
      - name: Centro de ayuda — formato, enlaces, capturas, cobertura y vigencia
        run: node --test scripts/test-ayuda.mjs

      # Con el build del paso anterior (backend inexistente): /ayuda público, búsqueda, guía, ruta, PDF, botón «?» en el
      # panel y en Mi espacio, filtro por rol y módulos, y «Cómo usar ADAMIA» en Adamia AI (1440 y 390).
      - name: Centro de ayuda — verificación en navegador (Playwright)
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://api.prueba.invalid/api
        run: |
          set -euo pipefail
          mkdir -p capturas-ayuda
          CAPTURAS=capturas-ayuda node scripts/verify-ayuda.mjs

      # (29/12/2026) Permisos › «Respuestas de WhatsApp sin aplicar» con el backend simulado (1440 y 390): tarjeta, confirmar
      # antes de aplicar (PATCH normal de la tabla) y oculta sin número de notificaciones. Reusa la compilación anterior.
      - name: Permisos — respuestas de WhatsApp sin aplicar (Playwright)
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://api.prueba.invalid/api
        run: |
          set -euo pipefail
          mkdir -p capturas-aprobacion-whatsapp
          CAPTURAS=capturas-aprobacion-whatsapp node scripts/verify-aprobacion-whatsapp.mjs

      # (27/11/2026) Página de inicio con la compilación anterior (backend inexistente, dominio de producción: la prueba
      # de robots «no indexar» se omite con aviso): portada, mosaico, secciones nuevas (WhatsApp hasta el último mensaje,
      # clima con pausa real, tablero y muro), enlaces sin 404, reducir movimiento, 390 px y blog.
      - name: Página de inicio — verificación en navegador (Playwright)
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://api.prueba.invalid/api
        run: |
          set -euo pipefail
          mkdir -p capturas-landing
          CAPTURAS=capturas-landing node scripts/verify-landing.mjs

      # (27/11/2026) Cálculos LFT con el backend simulado (copia del motor del servidor; 1440 y 390): calculadora pública =
      # servidor, finiquito con fórmulas y «Incluir 20 días por año (art. 50)», guardado con entradas = detalle, versión
      # anterior marcada sin recalcular y aguinaldo con corte al 31/12. Reusa la compilación anterior.
      - name: Finiquitos, aguinaldos y calculadora — cálculos LFT (Playwright)
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://api.prueba.invalid/api
        run: |
          set -euo pipefail
          mkdir -p capturas-calculos-lft
          CAPTURAS=capturas-calculos-lft node scripts/verify-calculos-lft.mjs

  # ─────────────────────────────────────────────
  # 3. BUILD — Validar compilación
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}


      - name: Build frontend image on GitHub runner
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://dev.adamia.com.mx/api
          NEXT_PUBLIC_RUTA_DOMAIN: https://dev.adamia.com.mx
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_RECRUITMENT_ENABLED: "true"
          NEXT_PUBLIC_AWS_URL: https://hr360-redlab.s3.us-west-1.amazonaws.com
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_RUTA_BACKEND%/}" = "https://dev.adamia.com.mx/api"
          test "${NEXT_PUBLIC_RUTA_DOMAIN%/}" = "https://dev.adamia.com.mx"
          docker build \
            --build-arg NEXT_PUBLIC_RUTA_BACKEND \
            --build-arg NEXT_PUBLIC_RUTA_DOMAIN \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY \
            --build-arg NEXT_PUBLIC_RECRUITMENT_ENABLED \
            --build-arg NEXT_PUBLIC_AWS_URL \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "adamia-frontend-dev:${{ github.sha }}" .
          docker save "adamia-frontend-dev:${{ github.sha }}" | gzip > frontend-image.tar.gz

      - name: Store frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dev-${{ github.sha }}
          path: frontend-image.tar.gz
          compression-level: 0
          retention-days: 3

  # ─────────────────────────────────────────────
  # 4. UPLOAD — Despliegue a Lightsail
  # ─────────────────────────────────────────────
  upload:
    name: Upload & Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      deploy_sha: ${{ github.sha }}
    steps:
      # (23/11/2026, «CONFIRMO limpieza automática en dev») El disco del servidor se llenó y los despliegues fallaron
      # («No space left on device»). Antes de cada despliegue: conservar solo las 3 versiones más recientes del
      # frontend en ~/adamia/releases y borrar imágenes/capas de Docker sin usar de más de 72 h. Docker nunca borra la
      # imagen de un contenedor existente (en marcha o detenido), así que no toca lo que está corriendo.
      - name: Liberar espacio en Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -u
            echo "Espacio antes:"; df -h / | tail -1
            releases="$HOME/adamia/releases"
            if [ -d "$releases" ]; then
              ls -1dt "$releases"/frontend-dev-* 2>/dev/null | tail -n +4 | xargs -r rm -rf --
            fi
            docker image prune -af --filter "until=72h" || true
            docker builder prune -af --filter "until=72h" || true
            echo "Espacio después:"; df -h / | tail -1

      - name: Download prebuilt frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-dev-${{ github.sha }}

      - name: Transfer frontend image to Lightsail
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: frontend-image.tar.gz
          target: /home/${{ secrets.LIGHTSAIL_USER }}/adamia/releases/frontend-dev-${{ github.sha }}
          command_timeout: 10m

      - name: Activate prebuilt frontend image on Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Iniciando deploy — SHA: ${{ github.sha }}"
            cd ~/adamia/frontend-dev
            test "$(git branch --show-current)" = "dev"
            git fetch origin refs/heads/dev
            test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
            current_sha=$(git rev-parse HEAD)
            # Reconcile the checkout left behind by the November 18 dev rollback.
            if [ "$current_sha" = "0e24c7a3b297c3ae118a02df7c1780e4a5689056" ]; then
              test -z "$(git status --porcelain)" || {
                echo "El checkout de dev en Lightsail tiene cambios locales."
                exit 1
              }
              git reset --keep "${{ github.sha }}"
            else
              git merge --ff-only "${{ github.sha }}"
            fi
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            cd ~/adamia
            previous_image=$(docker inspect --format='{{.Image}}' adamia_frontend_dev)
            docker tag "$previous_image" "adamia-frontend-dev:rollback-${{ github.sha }}"
            docker load --input "releases/frontend-dev-${{ github.sha }}/frontend-image.tar.gz"
            test "$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' adamia-frontend-dev:${{ github.sha }})" = "${{ github.sha }}"
            docker tag "adamia-frontend-dev:${{ github.sha }}" adamia-frontend-dev:latest
            docker compose up -d --no-build --no-deps frontend-dev
            echo "✅ Imagen precompilada de dev activada"

  # ─────────────────────────────────────────────
  # 5. DEPLOY — Health check
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — Health Check
    runs-on: ubuntu-latest
    needs: upload
    environment: dev
    steps:
      - name: Esperar que la app levante
        run: sleep 15

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.APP_HEALTH_URL }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "❌ Health check falló con status $STATUS"
            exit 1
          fi
          echo "✅ La app responde correctamente (HTTP $STATUS)"

      - name: Registrar SHA desplegado
        run: |
          echo "SHA desplegado: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.event.head_commit.message }}"
