name: CI/CD — Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: adamia-lightsail-deploy
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. PREPARE — Validar instalación
  # ─────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────
  # 2. VALIDATE — Lint e integración MySQL
  # ─────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}

      - name: Start MySQL for integration tests
        run: |
          set -e

          sudo systemctl start mysql

          echo "Configurando MySQL..."

          MYSQL_ADMIN_FILE="/etc/mysql/debian.cnf"

          if [ ! -f "$MYSQL_ADMIN_FILE" ]; then
            echo "No existe el archivo de credenciales administrativas"
            exit 1
          fi

          sudo mysql --defaults-file="$MYSQL_ADMIN_FILE" -e "
            ALTER USER 'root'@'localhost'
            IDENTIFIED WITH caching_sha2_password
            BY 'cau_ci_test_only';
          "

          echo "Verificando conexión MySQL..."

          mysqladmin ping \
            -h 127.0.0.1 \
            -uroot \
            -pcau_ci_test_only

          echo "MySQL listo para pruebas"

      - name: Lint (errores = falla | warnings = OK)
        run: npm run lint

      - name: Control de Activos — integración MySQL
        env:
          CAU_TEST_HOST: 127.0.0.1
          CAU_TEST_PORT: "3306"
          CAU_TEST_PASSWORD: cau_ci_test_only
        run: node --test scripts/test-activos-modules.mjs scripts/test-activos-api.mjs

  # ─────────────────────────────────────────────
  # 3. BUILD — Validar compilación
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}-${{ hashFiles('package-lock.json') }}


      - name: Build frontend image on GitHub runner
        env:
          NEXT_PUBLIC_RUTA_BACKEND: https://dev.adamia.com.mx/api
          NEXT_PUBLIC_RUTA_DOMAIN: https://dev.adamia.com.mx
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_RECRUITMENT_ENABLED: "true"
          NEXT_PUBLIC_AWS_URL: https://hr360-redlab.s3.us-west-1.amazonaws.com
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_RUTA_BACKEND%/}" = "https://dev.adamia.com.mx/api"
          test "${NEXT_PUBLIC_RUTA_DOMAIN%/}" = "https://dev.adamia.com.mx"
          docker build \
            --build-arg NEXT_PUBLIC_RUTA_BACKEND \
            --build-arg NEXT_PUBLIC_RUTA_DOMAIN \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY \
            --build-arg NEXT_PUBLIC_RECRUITMENT_ENABLED \
            --build-arg NEXT_PUBLIC_AWS_URL \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "adamia-frontend-dev:${{ github.sha }}" .
          docker save "adamia-frontend-dev:${{ github.sha }}" | gzip > frontend-image.tar.gz

      - name: Store frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dev-${{ github.sha }}
          path: frontend-image.tar.gz
          compression-level: 0
          retention-days: 3

  # ─────────────────────────────────────────────
  # 4. UPLOAD — Despliegue a Lightsail
  # ─────────────────────────────────────────────
  upload:
    name: Upload & Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      deploy_sha: ${{ github.sha }}
    steps:
      - name: Download prebuilt frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-dev-${{ github.sha }}

      - name: Transfer frontend image to Lightsail
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: frontend-image.tar.gz
          target: /home/${{ secrets.LIGHTSAIL_USER }}/adamia/releases/frontend-dev-${{ github.sha }}
          command_timeout: 10m

      - name: Activate prebuilt frontend image on Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Iniciando deploy — SHA: ${{ github.sha }}"
            cd ~/adamia/frontend-dev
            test "$(git branch --show-current)" = "dev"
            git fetch origin dev
            git merge --ff-only "${{ github.sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            cd ~/adamia
            previous_image=$(docker inspect --format='{{.Image}}' adamia_frontend_dev)
            docker tag "$previous_image" "adamia-frontend-dev:rollback-${{ github.sha }}"
            docker load --input "releases/frontend-dev-${{ github.sha }}/frontend-image.tar.gz"
            test "$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' adamia-frontend-dev:${{ github.sha }})" = "${{ github.sha }}"
            docker tag "adamia-frontend-dev:${{ github.sha }}" adamia-frontend-dev:latest
            docker compose up -d --no-build --no-deps frontend-dev
            echo "✅ Imagen precompilada de dev activada"

  # ─────────────────────────────────────────────
  # 5. DEPLOY — Health check
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — Health Check
    runs-on: ubuntu-latest
    needs: upload
    environment: dev
    steps:
      - name: Esperar que la app levante
        run: sleep 15

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.APP_HEALTH_URL }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "❌ Health check falló con status $STATUS"
            exit 1
          fi
          echo "✅ La app responde correctamente (HTTP $STATUS)"

      - name: Registrar SHA desplegado
        run: |
          echo "SHA desplegado: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.event.head_commit.message }}"
